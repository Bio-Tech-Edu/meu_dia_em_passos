<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Dia em Passos — página modelo</title>
<style>
  /* ========== Tokens de design ========== */
  :root {
    --cor-fundo: #FFF9F0;
    --cor-texto: #3A3A3A;
    --cor-linha: #E3DACB;      /* fio discreto do rodapé */
    --cor-bancada: #EDE6DA;    /* fundo apenas na tela */

    --fonte-titulo: "Nunito", "Quicksand", "Varela Round", ui-rounded,
                    "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --fonte-texto: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;

    --pagina-largura: 210mm;
    --pagina-altura: 297mm;
    --margem-lateral: 16mm;    /* dentro da área imprimível da maioria das impressoras */
    --margem-topo: 14mm;
    --margem-base: 12mm;
    --altura-cabecalho: 22mm;
    --altura-rodape: 10mm;
  }

  /* ========== Página A4 ========== */
  @page { size: A4 portrait; margin: 0; }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--cor-bancada);
    color: var(--cor-texto);
    font-family: var(--fonte-texto);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .pagina {
    width: var(--pagina-largura);
    height: var(--pagina-altura);
    margin: 8mm auto;
    padding: var(--margem-topo) var(--margem-lateral) var(--margem-base);
    background: var(--cor-fundo);
    display: grid;
    grid-template-rows: var(--altura-cabecalho) 1fr var(--altura-rodape);
    overflow: hidden;
    box-shadow: 0 1mm 4mm rgba(0, 0, 0, 0.12);
  }

  /* ========== Cabeçalho ========== */
  .cabecalho {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8mm;
  }

  .cabecalho h1 {
    margin: 0;
    font-family: var(--fonte-titulo);
    font-weight: 800;
    font-size: 24pt;
    line-height: 1.2;
    letter-spacing: 0.01em;
    color: var(--cor-texto);
  }

  .infinito {
    flex: none;
    width: 16mm;
    height: auto;
    margin-top: 2mm;
  }

  /* ========== Área central (vazia de propósito) ========== */
  .conteudo {
    min-height: 0;
    padding: 6mm 0;
  }

  /* ========== Rodapé ========== */
  .rodape {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-top: 0.3mm solid var(--cor-linha);
    padding-top: 2.5mm;
    font-family: var(--fonte-titulo);
    font-size: 10pt;
    line-height: 1.2;
    color: var(--cor-texto);
  }

  /* ========== Impressão ========== */
  @media print {
    body { background: var(--cor-fundo); }
    .pagina {
      margin: 0;
      box-shadow: none;
      break-after: page;
      page-break-after: always;
    }
  }

  /* ========== Telas estreitas (leitura digital) ========== */
  @media screen and (max-width: 220mm) {
    .pagina { margin: 0 auto; }
  }
</style>
</head>
<body>

<div class="pagina">

  <header class="cabecalho">
    <h1>Título da página</h1>
    <!-- Símbolo decorativo: oculto para leitores de tela -->
    <svg class="infinito" viewBox="0 0 64 32" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="arco-iris" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#E5736F"/>
          <stop offset="20%"  stop-color="#F29B5C"/>
          <stop offset="40%"  stop-color="#EDC84F"/>
          <stop offset="60%"  stop-color="#74BE7B"/>
          <stop offset="80%"  stop-color="#58A3CF"/>
          <stop offset="100%" stop-color="#9A7FD0"/>
        </linearGradient>
      </defs>
      <path d="M32 16 C26 6 8 4 8 16 C8 28 26 26 32 16 C38 6 56 4 56 16 C56 28 38 26 32 16 Z"
            fill="none" stroke="url(#arco-iris)" stroke-width="4.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </header>

  <main class="conteudo" aria-label="Área de conteúdo da página">
    <!-- Espaço livre para o conteúdo de cada página do planner -->
  </main>

  <footer class="rodape">
    <span>Meu Dia em Passos</span>
    <span>Página ___</span>
  </footer>

</div>

</body>
</html>
